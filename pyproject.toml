[project]
name = "gpx-mcp"
version = "0.1.0"
description = "MCP server for bike route planning via BRouter, Nominatim and Overpass."
requires-python = ">=3.11"
dependencies = [
    "gpxpy>=1.6.2",
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.1",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
viewer = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
gpx-mcp = "gpx_mcp.server:main"
gpx-mcp-web = "gpx_mcp.viewer.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpx_mcp"]
